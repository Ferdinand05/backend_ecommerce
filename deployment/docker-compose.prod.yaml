services:
  postgres:
    image: postgres:18-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Port tidak diekspos ke host EC2 demi keamanan
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce_network
    deploy:
      resources:
        limits:
          memory: 300M

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce_network
    deploy:
      resources:
        limits:
          memory: 50M

  migrate:
    image: migrate/migrate:v4.19.0
    container_name: ecommerce_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../database/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
        "up"
      ]
    networks:
      - ecommerce_network

  api:
    # Mengambil image langsung dari Docker Hub
    # GANTI "username_docker_kamu" dengan username Docker Hub milikmu
    image: ferdinand05/ecommerce-api:latest
    container_name: ecommerce_api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../.env
    ports:
      - "80:8080" # Port 80 untuk akses web standar
    networks:
      - ecommerce_network
    deploy:
      resources:
        limits:
          memory: 200M

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT}:8025"
    networks:
      - ecommerce_network
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  postgres_data:

networks:
  ecommerce_network:
    driver: bridge
