    ProductVariantImageResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        alt: { type: string, nullable: true }
        sort_order: { type: integer }
    VariantEnvelope:
      type: object
      properties:
        variant: { $ref: "#/components/schemas/ProductVariantResponse" }
    VariantsResponse:
      type: object
      properties:
        variants:
          type: array
          items: { $ref: "#/components/schemas/ProductVariantResponse" }
    ProductImageResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
