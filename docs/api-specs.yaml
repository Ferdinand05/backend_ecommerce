        image: { $ref: "#/components/schemas/ProductImageResponse" }
    ImagesResponse:
      type: object
      properties:
        images:
          type: array
          items: { $ref: "#/components/schemas/ProductImageResponse" }
    ImageUploadRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        alt: { type: string }
        sort_order: { type: integer }
    InventoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_variant_id: { type: string, format: uuid }
        quantity: { type: integer }
        reserved_quantity: { type: integer }
        created_at: { type: string, format: date-time }
