openapi: 3.0.3
info:
  title: Ecommerce Backend API
  version: 1.0.0
  description: |
    Ecommerce API for public catalog, customer checkout, and admin operations.
    Authenticated endpoints use JWT Bearer tokens. Admin endpoints additionally
    require the `admin` role. Paths include `/api/v1`.
servers:
  - url: http://13.211.208.214/api/v1
    description: API v1

tags:
  - name: Public - Auth
  - name: Public - Categories
  - name: Public - Products
  - name: Public - Product Variants
  - name: Public - Product Images
  - name: Public - Webhooks
  - name: Customer - Shipping
  - name: Customer - Cart
  - name: Customer - Checkout
  - name: Customer - Orders
  - name: Customer - Payments
  - name: Customer - Shipments
  - name: Admin - User Management
  - name: Admin - Roles
  - name: Admin - Categories
  - name: Admin - Products
  - name: Admin - Product Variants
  - name: Admin - Product Images
  - name: Admin - Inventory
  - name: Admin - Orders
  - name: Admin - Payments
  - name: Admin - Shipments

paths:
  /auth/register:
    post:
      tags: [Public - Auth]
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/login:
    post:
      tags: [Public - Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Auth tokens and user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/email-verification/verify:
    post:
      tags: [Public - Auth]
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/refresh:
    post:
      tags: [Public - Auth]
      summary: Refresh JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Refreshed tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/logout:
    post:
      tags: [Public - Auth]
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "204": { description: Logged out }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/email-verification/resend:
    post:
      tags: [Public - Auth]
      summary: Resend email verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "204": { description: Verification email queued }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/password/forgot:
    post:
      tags: [Public - Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "204": { description: Request accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /auth/password/reset:
    post:
      tags: [Public - Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password reset }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /categories:
    get:
      tags: [Public - Categories]
      summary: List categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriesResponse" }
        "500": { $ref: "#/components/responses/ServerError" }
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    get:
      tags: [Public - Categories]
      summary: Get category by ID
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /categories/slug/{slug}:
    get:
      tags: [Public - Categories]
      summary: Get category by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /products:
    get:
      tags: [Public - Products]
      summary: List products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductsResponse" }
        "500": { $ref: "#/components/responses/ServerError" }
  /products/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Products]
      summary: Get product by ID
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetailEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /products/slug/{slug}:
    get:
      tags: [Public - Products]
      summary: Get product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetailEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /products/{product_id}/variants:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Product Variants]
      summary: List product variants
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /products/{product_id}/variants/{variant_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: variant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Product Variants]
      summary: Get variant
      responses:
        "200":
          description: Variant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /products/{product_id}/images:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Product Images]
      summary: List product images
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImagesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Public - Product Images]
      summary: Upload product image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImageUploadRequest" }
      responses:
        "201":
          description: Image uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Image too large }
        "415": { description: Unsupported image type }
        "500": { $ref: "#/components/responses/ServerError" }
  /products/{product_id}/images/{image_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: image_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Product Images]
      summary: Get product image
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /products/{product_id}/variants/{variant_id}/images:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: variant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Product Images]
      summary: List variant images
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImagesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /products/{product_id}/variants/{variant_id}/images/{image_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: variant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: image_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public - Product Images]
      summary: Get variant image
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /shipping/areas:
    get:
      tags: [Customer - Shipping]
      summary: Search shipping areas
      security: [{ BearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching areas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AreasResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { description: Shipping provider error }
  /shipping/rates:
    post:
      tags: [Customer - Shipping]
      summary: Calculate shipping rates
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculateRatesRequest" }
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Product variants unavailable for shipping }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { description: Shipping provider error }

  /cart:
    get:
      tags: [Customer - Cart]
      summary: Get current user's cart
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Customer - Cart]
      summary: Clear current user's cart
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Cart cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /cart/items:
    post:
      tags: [Customer - Cart]
      summary: Add item to cart
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemRequest" }
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartItemEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /cart/items/{item_id}/increase:
    post:
      tags: [Customer - Cart]
      summary: Increase cart item quantity
      security: [{ BearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartItemEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /cart/items/{item_id}/decrease:
    post:
      tags: [Customer - Cart]
      summary: Decrease cart item quantity
      security: [{ BearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated cart item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartItemEnvelope" }
        "204": { description: Item removed from cart }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /cart/items/{item_id}:
    delete:
      tags: [Customer - Cart]
      summary: Remove item from cart
      security: [{ BearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Item removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /checkout/preview:
    post:
      tags: [Customer - Checkout]
      summary: Preview current cart checkout
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Checkout preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: One or more items unavailable }
        "500": { $ref: "#/components/responses/ServerError" }

  /me/orders:
    post:
      tags: [Customer - Orders]
      summary: Create order from cart
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Cart item or shipping service unavailable }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Customer - Orders]
      summary: List current user's orders
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Orders and pagination metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /me/orders/{order_id}:
    get:
      tags: [Customer - Orders]
      summary: Get own order
      security: [{ BearerAuth: [] }]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /me/orders/{order_id}/payment:
    post:
      tags: [Customer - Payments]
      summary: Create payment for own order
      security: [{ BearerAuth: [] }]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Payment checkout details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePaymentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: Payment period expired }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { description: Payment provider state could not be verified }
  /me/orders/{order_id}/shipment:
    get:
      tags: [Customer - Shipments]
      summary: Get shipment for own order
      security: [{ BearerAuth: [] }]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /me/shipments/{shipment_id}:
    get:
      tags: [Customer - Shipments]
      summary: Get own shipment
      security: [{ BearerAuth: [] }]
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /me/shipments/{shipment_id}/tracking:
    get:
      tags: [Customer - Shipments]
      summary: Track own shipment
      security: [{ BearerAuth: [] }]
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tracking history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentTrackingResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/xendit:
    post:
      tags: [Public - Webhooks]
      summary: Xendit invoice callback
      description: Public route; verified using the Xendit callback token header, not JWT.
      parameters:
        - name: x-callback-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCallback" }
      responses:
        "200":
          description: Callback processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /admin/users:
    get:
      tags: [Admin - User Management]
      summary: List users
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Public - Auth]
      summary: Create user
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}:
    get:
      tags: [Public - Auth]
      summary: Get user
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
