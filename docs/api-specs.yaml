        "500": { $ref: "#/components/responses/ServerError" }
        "502": { description: Shipment provider state could not be verified }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
  responses:
    BadRequest:
      description: Invalid request, parameter, or body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication failed or token invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated user lacks admin role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: State conflict or resource already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    RegisterRequest:
      type: object
      required: [email, password, first_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    LoginResponse:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, format: int64 }
        user: { $ref: "#/components/schemas/UserResponse" }
    RefreshResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, format: int64 }
      required: [access_token, refresh_token, expires_in]
    RegisterResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/RoleResponse" }
        status: { type: string }
        email_verified_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, password, first_name, role_id]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role_id: { type: string, format: uuid }
    RoleResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
    CategoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryEnvelope:
      type: object
      properties:
        category: { $ref: "#/components/schemas/CategoryResponse" }
    CategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryResponse" }
    ProductRequest:
      type: object
      required: [category_id, name]
      properties:
        category_id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
    ProductCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    ProductImageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        alt: { type: string, nullable: true }
        sort_order: { type: integer }
    ProductStock:
      type: object
      properties:
        quantity: { type: integer }
        reserved_quantity: { type: integer }
    ProductVariantSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        price: { type: number }
        is_active: { type: boolean }
        inventory: { $ref: "#/components/schemas/ProductStock" }
    ProductResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        category: { $ref: "#/components/schemas/ProductCategory" }
        images:
          type: array
          items: { $ref: "#/components/schemas/ProductImageSummary" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductDetail:
      allOf:
        - { $ref: "#/components/schemas/ProductResponse" }
        - type: object
          properties:
            variants:
              type: array
              items: { $ref: "#/components/schemas/ProductVariantSummary" }
    ProductEnvelope:
      type: object
      properties:
        product: { $ref: "#/components/schemas/ProductResponse" }
    ProductDetailEnvelope:
      type: object
      properties:
        product: { $ref: "#/components/schemas/ProductDetail" }
    ProductsResponse:
      type: object
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductResponse" }
    ProductVariantRequest:
      type: object
      required: [sku, name, price, weight_grams]
      properties:
        sku: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 150 }
        price: { type: number, format: decimal }
        weight_grams: { type: integer, minimum: 1, maximum: 100000 }
    ProductVariantResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        price: { type: number }
        is_active: { type: boolean }
        weight_grams: { type: integer }
        inventory: { $ref: "#/components/schemas/VariantInventory" }
        images:
          type: array
          items: { $ref: "#/components/schemas/ProductVariantImageResponse" }
    VariantInventory:
      type: object
      properties:
